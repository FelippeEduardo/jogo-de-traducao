<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo de Tradução</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Traduza a palavra!</h1>
  <p>Palavra: <span id="palavra"></span></p>
  <input type="text" id="resposta" placeholder="Digite a tradução em inglês">
  <button onclick="verificar()">Verificar</button>
  <p id="resultado"></p>
  <p>Pontos: <span id="pontos">0</span></p>

  <script>
    const palavras = [
      "caderno", "lápis", "caneta", "borracha", "régua", "mochila",
      "quadro", "giz", "apontador", "estojo", "papel", "tesoura",
      "cola", "calculadora", "mapa", "globo", "carteira", "cadeira",
      "cachorro", "gato", "casa", "carro", "livro", "sol", "lua",
      "árvore", "amigo", "comida"
    ];

    let palavraAtual;
    let traducaoAtual;
    let pontos = 0;

    async function traduzir(palavra) {
      const response = await fetch(
        `https://api.mymemory.translated.net/get?q=${encodeURIComponent(palavra)}&langpair=pt|en`
      );
      const data = await response.json();
      return data.responseData.translatedText.toLowerCase();
    }

    async function novaPalavra() {
      palavraAtual = palavras[Math.floor(Math.random() * palavras.length)];
      traducaoAtual = await traduzir(palavraAtual);

      document.getElementById("palavra").textContent = palavraAtual;
      document.getElementById("resposta").value = "";
      document.getElementById("resultado").textContent = "";
    }

    function verificar() {
      const resposta = document.getElementById("resposta").value.trim().toLowerCase();
      if (resposta === traducaoAtual) {
        pontos++;
        document.getElementById("resultado").textContent = "✅ Correto!";
      } else {
        pontos = 0;
        document.getElementById("resultado").textContent = "❌ Errado. Correto: " + traducaoAtual;
      }
      document.getElementById("pontos").textContent = pontos;
      setTimeout(novaPalavra, 2000);
    }

    novaPalavra();
  </script>
</body>
</html>
